<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bid Management App — Interactive Prototype</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0e0e10; font-family: -apple-system, "Segoe UI", Calibri, Arial, sans-serif; padding: 24px; }
.shell { max-width: 1180px; margin: 0 auto; background: #18181b; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; min-height: 640px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.topbar .app { display: flex; align-items: center; gap: 9px; color: #e9e9ec; font-size: 14px; font-weight: 700; }
.topbar .app svg { color: #8ab4ff; }
.topbar .who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #9a9aa0; }
.topbar .who .pill { display: flex; align-items: center; gap: 7px; background: #202024; border: 1px solid rgba(255,255,255,0.09); border-radius: 20px; padding: 5px 12px 5px 8px; }
.topbar .who .pill .avatar { width: 20px; height: 20px; border-radius: 50%; background: #2f5fd6; color: #fff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.topbar .who .pill.none .avatar { background: #3a3a40; }
.topbar .who a { color: #8ab4ff; text-decoration: none; cursor: pointer; font-weight: 600; }
.body { display: flex; }
.sidebar { width: 250px; flex-shrink: 0; padding: 18px 12px; border-right: 1px solid rgba(255,255,255,0.08); max-height: 760px; overflow-y: auto; }
.navitem { display: flex; align-items: center; gap: 12px; color: #b7b7bc; text-decoration: none; font-size: 14.5px; padding: 9px 12px; border-radius: 10px; margin-bottom: 1px; cursor: pointer; white-space: nowrap; }
.navitem svg { flex-shrink: 0; opacity: .85; }
.navitem:hover { background: rgba(255,255,255,0.05); color: #e9e9ec; }
.navitem.active { background: #1d3a6e; color: #8ab4ff; font-weight: 600; }
.navitem.active svg { opacity: 1; }
.navitem.disabled { opacity: .32; pointer-events: none; }
.navsep { height: 1px; background: rgba(255,255,255,0.08); margin: 10px 4px 12px; }
.navgroup { color: #6d6d73; font-size: 10.5px; letter-spacing: .05em; padding: 14px 12px 5px; }
.main { flex: 1; padding: 28px 36px; color: #e9e9ec; min-width: 0; }
h1 { font-size: 22px; font-weight: 700; color: #f4f4f5; margin-bottom: 6px; }
.subtitle { color: #8a8a90; font-size: 14px; margin-bottom: 22px; }
.stepwrap { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
.stepwrap:last-child { border-bottom: none; }
.stepnum { width: 24px; height: 24px; border-radius: 50%; background: #2f5fd6; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.stepbody { flex: 1; min-width: 0; }
.stepbody .u { font-size: 15px; font-weight: 600; color: #f4f4f5; margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
.stepbody .u svg { opacity: .6; flex-shrink: 0; }
.stepbody .s { font-size: 13.5px; color: #a5a5ab; padding-left: 24px; display: flex; align-items: center; gap: 7px; }
.stepbody .s svg { opacity: .7; flex-shrink: 0; }
.aicard { margin-top: 20px; border: 1px solid rgba(138,180,255,0.35); background: rgba(47,95,214,0.12); border-radius: 12px; padding: 16px 18px; display: flex; gap: 12px; }
.aicard svg { color: #8ab4ff; flex-shrink: 0; margin-top: 2px; }
.aicard .t { font-size: 13px; font-weight: 700; color: #8ab4ff; margin-bottom: 5px; }
.aicard .d { font-size: 13.5px; color: #c2c2c8; line-height: 1.55; }
.rolecards { display: flex; flex-direction: column; gap: 10px; }
.rolecard { border: 1px solid rgba(255,255,255,0.1); background: #1c1c20; border-radius: 12px; padding: 16px 18px; cursor: pointer; }
.rolecard:hover { border-color: #3a6fe0; background: #1d2436; }
.rolecard .rl { font-size: 15px; font-weight: 700; color: #f4f4f5; margin-bottom: 3px; }
.rolecard .rd { font-size: 13.5px; color: #9a9aa0; }
.card { background: #1c1c20; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
.card h2 { font-size: 14px; color: #e9e9ec; margin-bottom: 14px; font-weight: 700; }
table.dtable { width: 100%; border-collapse: collapse; font-size: 13px; }
table.dtable th { text-align: left; color: #8a8a90; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
table.dtable td { padding: 10px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); color: #d4d4d8; }
table.dtable tr:last-child td { border-bottom: none; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: rgba(138,180,255,0.15); color: #8ab4ff; }
.pending { text-align: center; padding: 50px 20px; }
.pending svg { color: #6d6d73; margin-bottom: 14px; }
.pending .pt { font-size: 15px; font-weight: 600; color: #d4d4d8; margin-bottom: 8px; }
.pending .pd { font-size: 13.5px; color: #8a8a90; max-width: 460px; margin: 0 auto; line-height: 1.6; }
</style>

ps", "steps": [["User opens Suppliers", "System loads the directory: contacts, brands, territory, terms, lead time, authorized status"], ["User searches or filters by category or authorized status", "System returns matching suppliers"], ["User clicks a supplier", "System opens that supplier's profile with every linked bid and quote"], ["User adds or edits a supplier profile", "System saves the changes and reflects them across every linked bid"]], "futureAI": null}, "agencies": {"label": "Agencies", "icon": "bank", "group": "Reference", "roles": ["owner", "manager", "viewer"], "type": "steps", "steps": [["User opens Agencies", "System loads the agency/facility directory with procurement contacts"], ["User clicks an agency", "System shows opportunities, bids submitted, awards, win rate, award value, and categories for that agency"], ["(Ongoing use)", "System automatically links every new bid to its agency record and updates the stats"], ["User reviews an agency's history", "System surfaces recurring purchasing patterns \u2014 categories or products this agency buys repeatedly"]], "futureAI": null}, "products": {"label": "Products", "icon": "box", "group": "Reference", "roles": ["owner", "manager", "specialist"], "type": "steps", "steps": [["User searches for a product, model, or part number", "System returns times bid, wins, last supplier, last cost, average bid price, last bid date"], ["User clicks into a product", "System shows every historical supplier, price, agency, award, and document tied to it"], ["This same product appears on a new solicitation later", "System automatically surfaces this product-history card as a Historical Match during New Bid entry"]], "futureAI": "AI Historical Matching \u2014 identify similar previous bids even when exact manufacturer/model information is unavailable, e.g. \u201cWe found 3 previous bids with similar technical requirements,\u201d so employees can review past suppliers, prices, and results without an exact identifier match."}, "documents": {"label": "Documents", "icon": "folder", "group": "Reference", "roles": ["owner", "manager", "specialist", "dataentry"], "type": "documents", "steps": [], "futureAI": null}, "reports": {"label": "Reports", "icon": "chart", "group": "Insights", "roles": ["owner", "manager", "viewer"], "type": "steps", "steps": [["User selects a report type", "System presents relevant filters for that report"], ["User applies filters (employee, agency, category, portal, date range, formal vs informal)", "System generates the report from live data"], ["User clicks Export", "System downloads the report as Excel/CSV"]], "futureAI": null}, "kpis": {"label": "Employee KPIs", "icon": "gauge", "group": "Insights", "roles": ["owner", "manager"], "type": "steps", "steps": [["Manager opens an employee's KPI view", "System reports productivity (bids reviewed/qualified/submitted, split Formal vs Informal), execution (on-time %, missed deadlines, average turnaround/sourcing time, bids returned), and results (wins, win rate, award $, gross profit)"], ["Manager compares employees or a date range", "System filters and aggregates KPIs by employee, period, and bid type"]], "futureAI": null}, "users": {"label": "Users and roles", "icon": "users", "group": "Admin", "roles": ["owner"], "type": "steps", "steps": [["Admin opens Users and Roles", "System lists all users with their current role and status"], ["Admin assigns or changes a role", "System applies that role's screen and financial-data permissions immediately"], ["Admin clicks a user", "System shows that user's assigned bids and recent activity"], ["Admin deactivates a user", "System revokes their access immediately and reassigns their open bids"]], "futureAI": null}, "audit": {"label": "Audit trail", "icon": "clock", "group": "Admin", "roles": ["owner"], "type": "steps", "steps": [["User opens Audit Trail", "System loads a chronological log of every tracked action with user, action, date, and time"], ["User filters by user, date range, or action type", "System filters the log to matching entries"], ["User clicks a log entry", "System shows the before/after detail, e.g. pricing changed from $12,400 to $11,800"]], "futureAI": null}, "fleet": {"label": "Fleet Management", "icon": "flag", "group": "Other", "roles": ["owner", "manager"], "type": "pending", "steps": [], "futureAI": null}};
const ROLES = {"owner": {"label": "Owner / Admin", "desc": "Full access to every page."}, "manager": {"label": "Bid Manager", "desc": "Assignments, approvals, bids and reporting."}, "specialist": {"label": "Bid Specialist", "desc": "Assigned bids, sourcing, pricing and documents."}, "dataentry": {"label": "Data Entry / Admin", "desc": "Create opportunities and upload solicitations. No financial or employee data."}, "viewer": {"label": "Accounting / Viewer", "desc": "Limited post-award and financial access."}};
const NAV_ORDER = ["dashboard", "notifications", "search", "pipeline", "allbids", "newbid", "mybids", "qualification", "sourcing", "estimation", "submissions", "awards", "suppliers", "agencies", "products", "documents", "reports", "kpis", "users", "audit", "fleet"];
const GROUP_ORDER = ["__top", "Bids", "Reference", "Insights", "Admin", "Other"];
const DOCS_ROWS = [["Solicitation PDF", "Solicitation", "ST-26-0038", "K. Wu", "Aug 5"], ["ABC Industrial quote #4471", "Supplier quote", "ST-26-0038", "M. Chen", "Aug 8"], ["Padlock spec sheet", "Specification", "ST-26-0052", "J. Alvarez", "Aug 9"], ["ISO 9001 certification", "Certification", "ST-26-0044", "J. Alvarez", "Aug 10"], ["Submission confirmation", "Confirmation", "ST-26-0035", "R. Patel", "Aug 12"], ["Award notice", "Award", "ST-26-0017", "D. Owens", "Aug 13"]];
const PENDING_TEXT = "This module is not part of the Phase 1 requirements document \u2014 it's flagged here as a placeholder for a later phase. If the bidding operation involves deliveries or installation crews, a future module could track vehicles, drivers, maintenance schedules, and job assignments. Exact scope and cost would need to be defined separately before estimating it.";

function icon(name, size) {
  size = size || 17;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';
}

let currentRole = null;
let currentPage = "home";

function allowedKeys() {
  if (!currentRole) return NAV_ORDER;
  return NAV_ORDER.filter(k => PAGES[k].roles.indexOf(currentRole) !== -1);
}

function firstAllowed(role) {
  for (const k of NAV_ORDER) {
    if (k === "notifications" || k === "search") continue;
    if (PAGES[k].roles.indexOf(role) !== -1) return k;
  }
  return NAV_ORDER[0];
}

function renderSidebar() {
  const allowed = new Set(allowedKeys());
  const groups = {};
  NAV_ORDER.forEach(k => {
    const g = PAGES[k].group || "__top";
    (groups[g] = groups[g] || []).push(k);
  });
  let html = '<div class="navitem'+(currentPage==="home"?" active":"")+'" data-key="home">'+icon("home")+'<span>Home</span></div><div class="navsep"></div>';
  GROUP_ORDER.forEach(g => {
    if (!groups[g]) return;
    if (g !== "__top") html += '<div class="navgroup">'+g.toUpperCase()+'</div>';
    groups[g].forEach(k => {
      const p = PAGES[k];
      const ok = allowed.has(k);
      const active = currentPage === k ? " active" : "";
      html += '<div class="navitem'+(ok?"":" disabled")+active+'" data-key="'+k+'">'+icon(p.icon)+'<span>'+p.label+'</span></div>';
    });
  });
  document.getElementById("sidebarNav").innerHTML = html;
  document.querySelectorAll(".navitem[data-key]").forEach(el => {
    el.addEventListener("click", () => {
      if (el.classList.contains("disabled")) return;
      currentPage = el.dataset.key;
      renderAll();
    });
  });
}

function renderHome() {
  const cards = Object.entries(ROLES).map(([key, r]) => (
    '<div class="rolecard" data-role="'+key+'"><div class="rl">'+r.label+'</div><div class="rd">'+r.desc+'</div></div>'
  )).join("");
  document.getElementById("mainContent").innerHTML =
    '<h1>Home</h1>' +
    '<div class="subtitle">Pick a role to preview exactly what that person can see and do.</div>' +
    '<div class="rolecards">'+cards+'</div>';
  document.querySelectorAll(".rolecard[data-role]").forEach(el => {
    el.addEventListener("click", () => {
      currentRole = el.dataset.role;
      currentPage = firstAllowed(currentRole);
      renderAll();
    });
  });
}

function stepsHtml(steps) {
  return steps.map((s, i) => (
    '<div class="stepwrap"><div class="stepnum">'+(i+1)+'</div>' +
    '<div class="stepbody"><div class="u">'+icon("user",14)+s[0]+'</div>' +
    '<div class="s">'+icon("arrow",13)+s[1]+'</div></div></div>'
  )).join("");
}

function aiHtml(text) {
  if (!text) return "";
  return '<div class="aicard">'+icon("sparkle",18)+
    '<div><div class="t">Future opportunity — Phase 3 AI</div><div class="d">'+text+'</div></div></div>';
}


function documentsHtml() {
  const rows = DOCS_ROWS.map(r => (
    '<tr><td>'+r[0]+'</td><td><span class="badge">'+r[1]+'</span></td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td></tr>'
  )).join("");
  return '<div class="card"><table class="dtable">' +
    '<tr><th>Document</th><th>Type</th><th>Bid ID</th><th>Uploaded by</th><th>Date</th></tr>' +
    rows + '</table></div>';
}

function pendingHtml() {
  return '<div class="card pending">' + icon("flag", 34) +
    '<div class="pt">Pending — not in the Phase 1 scope</div>' +
    '<div class="pd">' + PENDING_TEXT + '</div></div>';
}

function renderPage(key) {
  const p = PAGES[key];
  let body = "";
  if (p.type === "documents") {
    body = documentsHtml() + '<div class="card"><h2>User action → system behavior</h2>' + stepsHtml([
      ["User opens Documents", "System lists every document across all bids, newest first"],
      ["User filters by type or Bid ID", "System filters the list to matching documents"],
      ["User uploads a new document to a bid", "System attaches it permanently to that Bid ID and logs the upload to the audit trail"],
      ["User clicks a document", "System opens or downloads the file"],
    ]) + '</div>';
  } else if (p.type === "pending") {
    body = pendingHtml();
  } else {
    body = '<div class="subtitle" style="margin-top:-14px">User action → system behavior · '+p.steps.length+' steps</div>' +
      stepsHtml(p.steps) + aiHtml(p.futureAI);
  }
  document.getElementById("mainContent").innerHTML = '<h1>'+p.label+'</h1>' + body;
}

function initials(role) {
  return ROLES[role].label.split(/[\s/]+/).filter(Boolean).map(w => w[0]).join("").slice(0,2).toUpperCase();
}

function renderTopBar() {
  const bar = document.getElementById("whoBar");
  if (currentRole) {
    bar.innerHTML = '<div class="pill"><div class="avatar">'+initials(currentRole)+'</div><span>Viewing as <strong style="color:#e9e9ec">'+ROLES[currentRole].label+'</strong></span></div><a id="switchRoleLink">Switch role</a>';
  } else {
    bar.innerHTML = '<div class="pill none"><div class="avatar">'+icon("user",12)+'</div><span>No user selected</span></div><a id="switchRoleLink">Choose a role</a>';
  }
  const link = document.getElementById("switchRoleLink");
  if (link) link.addEventListener("click", () => { currentRole = null; currentPage = "home"; renderAll(); });
}

function renderAll() {
  renderSidebar();
  renderTopBar();
  if (currentPage === "home") renderHome();
  else renderPage(currentPage);
}

renderAll();
</script>
</body>
</html>
